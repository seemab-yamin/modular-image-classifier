# config.yaml
seed: 20
arch: "custom"
epochs: 10
dataset: "cifar10"
batch_size: 32
learning_rate: 0.001
num_workers: 2
pre_trained: false
freeze_backbone: false
use_amp: true
use_weight_decay: 5e-4
use_scheduler: 1e-6 # minimal learning rate for scheduler
use_grad_clip: 1.0
data_dir: "./data"
artifacts_dir: "./artifacts"